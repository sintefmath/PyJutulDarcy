[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jutuldarcy"
version = "1.3.0.dev0"
description = "Reservoir simulation with JutulDarcy in Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reservoir simulation", "jutuldarcy"]
authors = [{name = "Olav Møyner", email = "olav.moyner@gmail.com"}]
maintainers = [{name = "Olav Møyner", email = "olav.moyner@gmail.com"}]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ["juliacall>=0.9.31,<0.10", "juliapkg>=0.1.22,<0.2", "numpy>=1.23,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11", "build>=1"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29,<1",
    "mkdocs-gen-files>=0.5,<1",
    # mkdocstrings 0.x uses the syntax-highlighter API from PyMdown <12.
    "pymdown-extensions>=10.3,<12",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/sintefmath/PyJutulDarcy"
"Julia repository" = "https://github.com/sintefmath/JutulDarcy.jl"
Documentation = "https://sintefmath.github.io/PyJutulDarcy/"
"Julia documentation" = "https://sintefmath.github.io/JutulDarcy.jl/stable/"

[tool.setuptools]
packages = ["jutuldarcy"]
package-data = {jutuldarcy = ["juliapkg.json", "*.jl"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
# Julia's GC safepoint signals can trigger spurious Python crash reports on Windows.
addopts = "-p no:faulthandler"
markers = ["integration: requires a working Julia installation", "plotting: requires CairoMakie or GLMakie"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"jutuldarcy/__init__.py" = ["F401", "F403"]
