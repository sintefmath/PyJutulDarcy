site_name: PyJutulDarcy
site_description: Differentiable reservoir simulation from Python with JutulDarcy 0.4.
site_url: https://sintefmath.github.io/PyJutulDarcy/
repo_url: https://github.com/sintefmath/PyJutulDarcy
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Get started: index.md
  - User guide: guide.md
  - Examples:
      - Build a model: examples/standalone.md
      - Run a DATA file: examples/spe9.md
      - Plot a reservoir: examples/plots.md
      - Compute gradients: examples/gradients.md
  - API reference: reference.md
  - Development: development.md
plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_examples.py
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
