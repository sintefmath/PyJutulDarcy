name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', julia: '1.11'}
          - {os: ubuntu-latest, python: '3.13', julia: '1.12'}
          - {os: windows-latest, python: '3.12', julia: '1.12'}
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}
      JULIA_NUM_THREADS: '2'
      PYTHON_JULIACALL_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - run: python -m pip install '.[test]'
      - run: ruff check jutuldarcy tests examples docs/gen_examples.py
      - run: python -m pytest -m 'not plotting' -v
      - run: python -m build

  plotting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYJUTULDARCY_TEST_PLOTTING: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: python -m pip install '.[test]'
      - run: python -c "import jutuldarcy as jd; jd.install_plotting('CairoMakie')"
      - run: python -m pytest -m plotting -v
